# OpenCode++ CI — GitHub Actions is the authoritative test site.
#
# Jobs:
#   1. build     : configure+build+ctest for the dev/release/size presets
#   2. abi-check : the C ABI header must compile as pure C11 (gcc + clang) and C++20
#   3. mock-api  : the mock provider server actually streams SSE on a live socket
#   4. hygiene    : hidden-character + whitespace checks on sources
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release, size]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j "$(nproc)"

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: CLI version smoke
        run: ./build/${{ matrix.preset }}/tools/opencodepp_cli --version

  store-sqlite:
    name: store (sqlite backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools + sqlite3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libsqlite3-dev

      - name: Configure (dev + sqlite)
        run: cmake --preset sqlite

      - name: Build
        run: cmake --build --preset sqlite -j "$(nproc)"

      - name: Test (mem + sqlite suites under ASan/LSan)
        run: ctest --preset sqlite --output-on-failure

  net-tls:
    name: net (mbedTLS backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools + mbedTLS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libmbedtls-dev

      - name: Configure (dev + mbedTLS)
        run: cmake --preset mbedtls

      - name: Build
        run: cmake --build --preset mbedtls -j "$(nproc)"

      - name: Test (net suite against the mbedTLS backend)
        run: ctest --preset mbedtls --output-on-failure

  abi-check:
    name: ABI header (C11 + C++20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ clang

      - name: gcc -std=c11
        run: gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -fsyntax-only include/opencode/opencode.h

      - name: clang -std=c11
        run: clang -std=c11 -Wall -Wextra -Wpedantic -Werror -fsyntax-only include/opencode/opencode.h

      - name: g++ -std=c++20
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -fsyntax-only -Iinclude include/opencode/opencode.h

  mock-api:
    name: mock provider smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Configure & build (dev)
        run: |
          cmake --preset dev
          cmake --build --preset dev -j "$(nproc)"

      - name: Start mock_api and verify SSE stream
        run: |
          ./build/dev/tools/mock_api --port 8123 &
          MOCK_PID=$!
          trap "kill $MOCK_PID 2>/dev/null || true" EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8123/health | grep -qx ok
          # SSE chat: stream 3 data events then a done event (POST endpoint)
          OUT="$(curl -fsSN -X POST --max-time 10 http://127.0.0.1:8123/v1/chat)"
          echo "$OUT"
          echo "$OUT" | grep -q '"type":"text"'
          echo "$OUT" | grep -q '"finish_reason":"stop"'
          echo "mock-api SSE smoke: OK"

  py-binding:
    name: python binding (ctypes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Configure
        run: cmake --preset release

      - name: Build shared library
        run: cmake --build --preset release -j "$(nproc)" --target opencodepp_shared

      - name: Run python binding test (needs libopencodepp.so)
        run: python3 bindings/python/tests/py_binding_test.py

  jni-binding:
    name: jni binding (JDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools + JDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build default-jdk

      - name: Configure
        run: cmake --preset release

      - name: Build shared + JNI libraries
        run: cmake --build --preset release -j "$(nproc)" \
          --target opencodepp_shared opencodepp_jni

      - name: Compile + run the Java harness
        run: |
          cd bindings/jni/java
          javac io/opencode/Opencode.java
          cd "$GITHUB_WORKSPACE"
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build/release/src" \
            java -Djava.library.path="$GITHUB_WORKSPACE/build/release/bindings/jni" \
            -cp bindings/jni/java io.opencode.Opencode

  fuzz:
    name: fuzz sweep (ASan, multiple seeds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Configure (dev = ASan/UBSan)
        run: cmake --preset dev

      - name: Build fuzz_test
        run: cmake --build --preset dev -j "$(nproc)" --target fuzz_test

      - name: Fuzz sweep (5 seeds)
        run: |
          for seed in 1 7 42 99 2026; do
            ./build/dev/tests/fuzz_test --seed "$seed" --iters 1000
          done

  soak:
    name: soak (mock resilience)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Configure & build run_agent + soak
        run: |
          cmake --preset dev
          cmake --build --preset dev -j "$(nproc)" \
            --target run_agent soak

      - name: Long soak (24 tasks, faults every 4th)
        run: |
          ./build/dev/tools/soak --bin ./build/dev/tools/run_agent \
            --tasks 24 --fault-every 4 --task-timeout 60 --workspace /tmp/soak_ws

  packaging:
    name: install + find_package (scratch consumer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build pkg-config

      - name: Configure & build (release)
        run: |
          cmake --preset release
          cmake --build --preset release -j "$(nproc)"

      - name: Install to a clean prefix
        run: |
          rm -rf /tmp/opencode-install
          cmake --install build/release --prefix /tmp/opencode-install
          ls -R /tmp/opencode-install

      - name: pkg-config smoke
        run: |
          export PKG_CONFIG_PATH=/tmp/opencode-install/lib/pkgconfig
          pkg-config --modversion opencodepp
          pkg-config --cflags --libs opencodepp
          pkg-config --cflags --libs opencodepp-static

      - name: Scratch consumer via find_package(opencodepp CONFIG)
        run: |
          rm -rf /tmp/opencode-scratch
          mkdir -p /tmp/opencode-scratch
          cat > /tmp/opencode-scratch/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(opencodepp_consumer C CXX)
          find_package(opencodepp CONFIG REQUIRED)
          add_executable(embed_static main.c)
          target_link_libraries(embed_static PRIVATE opencodepp::opencodepp_static)
          add_executable(embed_shared main.c)
          target_link_libraries(embed_shared PRIVATE opencodepp::opencodepp_shared)
          EOF
          cat > /tmp/opencode-scratch/main.c <<'EOF'
          #include <opencode/opencode.h>
          #include <stdio.h>
          #include <string.h>
          int main(void) {
              opencode_engine_t* e = 0;
              opencode_status_t st = opencode_engine_create(0, &e);
              if (st != OPENCODE_OK || e == 0) return 1;
              st = opencode_memory_write(e, OPENCODE_MEMORY_FACT,
                                         "scratch.probe", "installed-ok", 0, 0, 0);
              if (st != OPENCODE_OK) return 2;
              char buf[256];
              size_t n = 0;
              st = opencode_memory_read(e, OPENCODE_MEMORY_FACT, "[]",
                                        buf, sizeof buf, &n);
              if (st != OPENCODE_OK) return 3;
              if (strstr(buf, "installed-ok") == 0) return 4;
              printf("abi=%u scratch consumer OK: %s\n", opencode_abi_version(), buf);
              opencode_engine_destroy(e);
              return 0;
          }
          EOF
          cmake -S /tmp/opencode-scratch -B /tmp/opencode-scratch/build \
            -DCMAKE_PREFIX_PATH=/tmp/opencode-install
          cmake --build /tmp/opencode-scratch/build -j "$(nproc)"
          /tmp/opencode-scratch/build/embed_static
          LD_LIBRARY_PATH=/tmp/opencode-install/lib /tmp/opencode-scratch/build/embed_shared

  hygiene:
    name: source hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hidden-character scan
        run: bash scripts/check_hidden_chars.sh
